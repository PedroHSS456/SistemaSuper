name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Stockfish 11 (avaliacao classica, sem rede neural): binario de ~1 MB em vez de ~79 MB.
      # O Makefile dele nao tem alvo Android, entao compila direto com o clang do NDK.
      - name: Compilar Stockfish 11 para Android arm64
        run: |
          set -euo pipefail
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT}}}"
          export PATH="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          git clone --depth 1 --branch sf_11 https://github.com/official-stockfish/Stockfish.git "$RUNNER_TEMP/sf"
          cd "$RUNNER_TEMP/sf/src"
          aarch64-linux-android21-clang++ -O3 -std=c++11 -stdlib=libc++ -fno-exceptions \
            -DNDEBUG -DIS_64BIT -DUSE_POPCNT -fPIE -pie -static-libstdc++ \
            -o stockfish *.cpp syzygy/tbprobe.cpp -latomic -lm
          llvm-strip stockfish
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"
          cp stockfish "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libstockfish.so"
          ls -l "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/"
          file stockfish

      - name: Aceitar licencas do SDK (ja vem instalado no runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"

      - name: Compilar APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Renomear APK
        run: cp app/build/outputs/apk/release/app-release.apk Chess-Auto-Player.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Chess-Auto-Player
          path: Chess-Auto-Player.apk

      - name: Publicar para baixar no celular
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v1.${{ github.run_number }}" Chess-Auto-Player.apk \
            --title "Chess Auto Player 1.${{ github.run_number }}" \
            --notes "Baixe o Chess-Auto-Player.apk e instale. Veja o README para ativar." \
            --latest
