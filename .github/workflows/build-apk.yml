name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Aceitar licencas do SDK (ja vem instalado no runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"

      - name: Compilar
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Renomear APK
        run: cp app/build/outputs/apk/release/app-release.apk Yoru-Launcher.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Yoru-Launcher
          path: Yoru-Launcher.apk

      - name: Publicar para baixar no celular
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v1.${{ github.run_number }}" Yoru-Launcher.apk \
            --title "Yoru Launcher 1.${{ github.run_number }}" \
            --notes "Baixe o Yoru-Launcher.apk, abra e instale. Nada no seu Android muda ate voce escolher esse launcher como padrao." \
            --latest
